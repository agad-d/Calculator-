<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- <p>calculator</p> -->
    <div id="calculator text-center">
        <div class="display text-center">
            <input class="show" type="text">

        </div>
        <div class="line-1">
            <button class="deleteBtn p-4" id="backSpace">⌫</button>
            <button class="btn calc-btn p-4" id="clear">AC</button>
            <button class="btn p-4">％</button>
            <button class="btn p-4">➗</button>
        </div>
        <div class="line-2">
            <button class="btn p-4">7</button>
            <button class="btn p-4">8</button>
            <button class="btn p-4">9</button>
            <button class="btn p-4">✖️</button>
        </div>
        <div class="line-3">
            <button class="btn p-4">4</button>
            <button class="btn p-4">5</button>
            <button class="btn p-4">6</button>
            <button class="btn p-4">➖</button>
        </div>

        <div class="line-4">
            <button class="btn p-4">1</button>
            <button class="btn p-4">2</button>
            <button class="btn p-4">3</button>
            <button class="btn p-4">➕</button>
        </div>

        <div class="line-5">
            <button class="btn p-4">➕➖</button>
            <button class="btn p-4">0</button>
            <button class="btn p-4">.</button>
            <button class="deleteBtn p-4" id="equal">🟰</button>
        </div>
    </div>




    <script src="index.js"></script>
</body>

</html>
